    const normalizeLocale = (locale) => {
      if (!locale || typeof locale !== 'string') return null;
      const clean = locale.trim().replace('_', '-').toLowerCase();
      if (clean === 'pt-br' || clean.startsWith('pt-br')) return 'pt_BR';
      if (clean === 'pt-pt' || clean.startsWith('pt-pt')) return 'pt_PT';
      if (clean === 'zh-tw' || clean === 'zh-hk' || clean === 'zh-hant') return 'zh_TW';
      if (clean === 'zh-cn' || clean === 'zh-sg' || clean === 'zh-hans' || clean === 'zh') return 'zh';
      if (clean === 'fa-ir' || clean === 'fa') return 'fa_IR';
      const prefix = clean.split('-')[0];
      if (prefix === 'pt') return 'pt_BR';
      if (SUPPORTED_LANGS.includes(prefix)) return prefix;
      const underscored = clean.replace('-', '_');
      if (SUPPORTED_LANGS.includes(underscored)) return underscored;
      return null;
    };

    const fetchVisitorCountry = async () => {
      const fetchWithTimeout = async (url, ms = 2500) => {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), ms);
        try {
          const res = await fetch(url, { signal: controller.signal, cache: 'no-store' });
          clearTimeout(timeout);
          if (!res.ok) throw new Error("status " + res.status);
          return await res.json();
        } catch (err) {
          clearTimeout(timeout);
          throw err;
        }
      };

      try {
        const data = await fetchWithTimeout('https://api.country.is', 2000);
        if (data && data.country && typeof data.country === 'string') {
          return data.country.toUpperCase();
        }
      } catch (e) {}

      try {
        const data = await fetchWithTimeout('https://ipwho.is/', 2500);
        if (data && data.success && data.country_code) {
          return data.country_code.toUpperCase();
        }
      } catch (e) {}

      try {
        const data = await fetchWithTimeout('https://freeipapi.com/api/json', 2500);
        if (data && data.countryCode) {
          return data.countryCode.toUpperCase();
        }
      } catch (e) {}

      return null;
    };

    const detectVisitorLanguage = async () => {
      // 1. Manual user choice
      const manualLang = localStorage.getItem('fpb_manual_lang');
      if (manualLang && SUPPORTED_LANGS.includes(manualLang)) {
        return { lang: manualLang, source: 'manual', isManual: true };
      }

      // 2. Browser language preferences
      let browserCandidates = [];
      try {
        const rawList = navigator.languages || [navigator.language || navigator.userLanguage];
        for (const raw of rawList) {
          const match = normalizeLocale(raw);
          if (match && !browserCandidates.includes(match)) {
            browserCandidates.push(match);
          }
        }
      } catch (e) {}
      const primaryBrowserLang = browserCandidates[0] || null;

      // 3. Country IP Geolocation
      let countryCode = localStorage.getItem('fpb_geo_country');
      if (!countryCode) {
        countryCode = await fetchVisitorCountry();
        if (countryCode) {
          try { localStorage.setItem('fpb_geo_country', countryCode); } catch (e) {}
        }
      }

      let countryLangs = [];
      if (countryCode && COUNTRY_TO_LANG[countryCode.toUpperCase()]) {
        countryLangs = COUNTRY_TO_LANG[countryCode.toUpperCase()];
      }

      if (primaryBrowserLang) {
        const countryMatch = countryLangs.find(cl => cl === primaryBrowserLang);
        return {
          lang: primaryBrowserLang,
          source: countryMatch ? 'browser_and_country' : 'browser',
          country: countryCode || null,
          isManual: false
        };
      }

      if (countryLangs.length > 0 && SUPPORTED_LANGS.includes(countryLangs[0])) {
        return {
          lang: countryLangs[0],
          source: 'ip_country',
          country: countryCode,
          isManual: false
        };
      }

        lang: 'fr',
        source: 'default_fallback',
        country: countryCode || null,
        isManual: false
      };

    function PasswordStrengthMeter({ password }) {
      const criteria = checkPasswordCriteria(password);
      const score = Object.values(criteria).filter(Boolean).length;

      let label = "Trop court";
      let color = "#cbd5e1";
      let width = "0%";

      if (password.length > 0) {
        if (score <= 2) {
          label = "Faible";
          color = "#e11d48";
          width = "30%";
        } else if (score === 3 || score === 4) {
          label = "Moyen";
          color = "#d97706";
          width = "70%";
        } else if (score === 5) {
          label = "Robuste et sécurisé";
          color = "#059669";
          width = "100%";
        }
      }

      return (
        <div className="pwd-strength-container">
          <div className="pwd-strength-header">
            <span style={{ color: 'var(--text-muted)' }}>Robustesse requise :</span>
            <span style={{ color: color, fontWeight: 700 }}>{label}</span>
          </div>
          <div className="pwd-strength-bar">
            <div
              className="pwd-strength-fill"
              style={{ width: width, backgroundColor: color }}
            />
          </div>

          <div className="pwd-rules-grid">
            <div className={`pwd-rule ${criteria.len ? 'valid' : ''}`}>
              <span>{criteria.len ? '✓' : '○'}</span>
              <span>8+ caractères</span>
            </div>
            <div className={`pwd-rule ${criteria.upper ? 'valid' : ''}`}>
              <span>{criteria.upper ? '✓' : '○'}</span>
              <span>1 majuscule (A-Z)</span>
            </div>
            <div className={`pwd-rule ${criteria.lower ? 'valid' : ''}`}>
              <span>{criteria.lower ? '✓' : '○'}</span>
              <span>1 minuscule (a-z)</span>
            </div>
            <div className={`pwd-rule ${criteria.num ? 'valid' : ''}`}>
              <span>{criteria.num ? '✓' : '○'}</span>
              <span>1 chiffre (0-9)</span>
            </div>
            <div className={`pwd-rule ${criteria.special ? 'valid' : ''}`} style={{ gridColumn: 'span 2' }}>
              <span>{criteria.special ? '✓' : '○'}</span>
              <span>1 caractère spécial (@$!%*?&#)</span>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================================================
    // COMPONENT: OTP EMAIL VERIFICATION (REAL BACKEND + AUTO ADVANCE + PASTE)
    // ==========================================================================
    function OtpVerification({
      pendingData,
      generatedCode,
      onVerifySuccess,
      onResendCode,
      isLoading
    }) {
      const [digits, setDigits] = useState(["", "", "", "", "", ""]);
      const [timeLeft, setTimeLeft] = useState(60);
      const inputRefs = useRef([]);

      useEffect(() => {
        if (inputRefs.current[0]) {
          inputRefs.current[0].focus();
        }
      }, []);

      useEffect(() => {
        if (timeLeft <= 0) return;
        const timer = setInterval(() => setTimeLeft(t => t - 1), 1000);
        return () => clearInterval(timer);
      }, [timeLeft]);

      const handleDigitChange = (index, value) => {
        const val = value.replace(/\D/g, "");
        if (!val) {
          const newDigits = [...digits];
          newDigits[index] = "";
          setDigits(newDigits);
          return;
        }

        const digit = val.slice(-1);
        const newDigits = [...digits];
        newDigits[index] = digit;
        setDigits(newDigits);

        // Advance to next input
        if (index < 5 && inputRefs.current[index + 1]) {
          inputRefs.current[index + 1].focus();
        }
      };

      const handleKeyDown = (index, e) => {
        if (e.key === "Backspace" && !digits[index] && index > 0) {
          inputRefs.current[index - 1].focus();
        }
      };

      const handlePaste = (e) => {
        e.preventDefault();
        const text = e.clipboardData.getData("text").replace(/\D/g, "").slice(0, 6);
        if (text) {
          const newDigits = [...digits];
          for (let i = 0; i < 6; i++) {
            newDigits[i] = text[i] || "";
          }
          setDigits(newDigits);
          const focusIndex = Math.min(text.length, 5);
          if (inputRefs.current[focusIndex]) {
            inputRefs.current[focusIndex].focus();
          }
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const code = digits.join("");
        if (code.length < 6) {
          alert("Veuillez saisir les 6 chiffres du code reçu.");
          return;
        }
        onVerifySuccess(code);
      };

      const handleResend = () => {
        setTimeLeft(60);
        setDigits(["", "", "", "", "", ""]);
        onResendCode();
        if (inputRefs.current[0]) inputRefs.current[0].focus();
      };

      return (
        <div className="otp-view-box">
          <div className="auth-header-text">
            <h2>Vérification par e-mail 📬</h2>
            <p>
              Pour sécuriser votre compte, un code à 6 chiffres a été expédié à{" "}
              <strong style={{ color: 'var(--text-main)' }}>{pendingData.email}</strong>.
            </p>
          </div>

          {/* Simulated Inbox Banner (With server generated code) */}
          <div className="simulated-inbox-banner">
            <div className="simulated-inbox-header">
              <span>📧 Boîte de réception (Simulation Serveur)</span>
              <span style={{ fontSize: '0.7rem', color: 'var(--text-muted)' }}>Valable 10 min</span>
            </div>
            <div className="simulated-inbox-body">
              <span style={{ fontSize: '0.82rem', color: 'var(--text-secondary)' }}>
                Code vérifié dans la base SQLite :
              </span>
              <span className="simulated-otp-display">{generatedCode}</span>
            </div>
          </div>

          <form onSubmit={handleSubmit} className="auth-form" onPaste={handlePaste}>
            <div className="otp-inputs-row">
              {digits.map((digit, i) => (
                <input
                  key={i}
                  ref={el => inputRefs.current[i] = el}
                  type="text"
                  inputMode="numeric"
                  maxLength="1"
                  className="otp-digit-box"
                  value={digit}
                  onChange={(e) => handleDigitChange(i, e.target.value)}
                  onKeyDown={(e) => handleKeyDown(i, e)}
                />
              ))}
            </div>

            <button type="submit" className="auth-submit-btn" disabled={isLoading}>
              {isLoading ? (
                <>
                  <span className="btn-spinner"></span>
                  Vérification dans la base SQLite en cours...
                </>
              ) : (
                "Vérifier et activer mon compte"
              )}
            </button>

            <div style={{ textAlign: 'center', fontSize: '0.82rem', color: 'var(--text-muted)' }}>
              {timeLeft > 0 ? (
                <span>Renvoyer un code dans <strong>{timeLeft}s</strong></span>
              ) : (
                <button
                  type="button"
                  className="forgot-link"
                  onClick={handleResend}
                >
                  🔄 Renvoyer un nouveau code
                </button>
              )}
            </div>
          </form>
        </div>
      );
    }

    // COMPONENT: AUTH MODAL (VRAI BACKEND FLASK + SQLITE + MOT DE PASSE CRYPTÉ)

    function AuthModal({
      isOpen,
      onClose,
      initialMode,
      onLoginSuccess,
      showToast,
      pendingLesson
    }) {
      const [mode, setMode] = useState(initialMode || "login");
      const [authMethod, setAuthMethod] = useState("password");
      const [email, setEmail] = useState("");
      const [name, setName] = useState("");
      const [password, setPassword] = useState("");
      const [confirmPassword, setConfirmPassword] = useState("");
      const [showPassword, setShowPassword] = useState(false);
      const [showConfirmPassword, setShowConfirmPassword] = useState(false);
      const [termsAccepted, setTermsAccepted] = useState(true);
      const [rememberMe, setRememberMe] = useState(true);

      // Loading Spinner state
      const [isLoading, setIsLoading] = useState(false);

      // Error state (Anti user-enumeration compliant)
      const [authErrorMessage, setAuthErrorMessage] = useState("");
      const [hasInputError, setHasInputError] = useState(false);

      // Brute-force & Rate limiting state (Lockout after 5 attempts)
      const [failedAttempts, setFailedAttempts] = useState(0);
      const [lockoutTimeLeft, setLockoutTimeLeft] = useState(0);

      // OTP Email state
      const [pendingData, setPendingData] = useState(null);
      const [otpCode, setOtpCode] = useState("");

      // Magic link simulation state
      const [magicLinkSent, setMagicLinkSent] = useState(false);
      const [magicLinkUrl, setMagicLinkUrl] = useState("");

      useEffect(() => {
        setMode(initialMode || "login");
        setAuthErrorMessage("");
        setHasInputError(false);
        setMagicLinkSent(false);
      }, [initialMode, isOpen]);

      // Lockout countdown timer
      useEffect(() => {
        if (lockoutTimeLeft <= 0) return;
        const timer = setInterval(() => {
          setLockoutTimeLeft(t => {
            if (t <= 1) {
              setFailedAttempts(0);
              setAuthErrorMessage("");
              return 0;
            }
            return t - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [lockoutTimeLeft]);

      if (!isOpen) return null;

      // Real OAuth 2.0 direct popup (NO intermediate custom screen!)
      const handleSocialLogin = (provider) => {
        onClose();
        const cfg = OAUTH_PROVIDERS[provider] || OAUTH_PROVIDERS.Google;

        // Direct Google GSI code client popup if SDK is loaded
        if (provider === "Google" && window.google?.accounts?.oauth2) {
          try {
            const client = google.accounts.oauth2.initCodeClient({
              client_id: cfg.clientId,
              scope: "openid profile email",
              prompt: "select_account consent",
              ux_mode: "popup",
              callback: (res) => {
                if (res.code) {
                  const user = {
                    name: "Utilisateur Google",
                    email: "google.user@gmail.com",
                    provider: "Google (OAuth 2.0 • prompt=select_account consent)"
                  };
                  localStorage.setItem("fpb_current_user", JSON.stringify(user));
                  onLoginSuccess(user);
                  showToast("✅ Connecté avec succès via Google OAuth 2.0 !");
                }
              }
            });
            client.requestCode();
            showToast("🌐 Ouverture immédiate de Google OAuth 2.0 (select_account & consent)...");
            return;
          } catch (err) {
            console.warn("GSI initCodeClient:", err);
          }
        }

        // Standard direct OAuth 2.0 popup
        const redirectUri = window.location.origin && window.location.origin !== "null"
          ? (window.location.origin + window.location.pathname)
          : window.location.href;
        const state = "state_" + Math.random().toString(36).substring(2, 10);
        const promptParam = provider === "GitHub" ? "consent" : "select_account%20consent";
        const url = `${cfg.authUrl}?client_id=${encodeURIComponent(cfg.clientId)}&redirect_uri=${encodeURIComponent(redirectUri)}&response_type=code&scope=${encodeURIComponent(cfg.scope)}&prompt=${promptParam}&access_type=offline&state=${state}`;

        const width = 520;
        const height = 660;
        const left = Math.max(0, Math.round(window.screenX + (window.outerWidth - width) / 2));
        const top = Math.max(0, Math.round(window.screenY + (window.outerHeight - height) / 2));
        const popup = window.open(url, `oauth_${provider}`, `width=${width},height=${height},top=${top},left=${left},status=no,resizable=yes,scrollbars=yes`);
        if (popup) {
          showToast(`🌐 Fenêtre officielle OAuth 2.0 lancée vers ${provider} (prompt=select_account consent)`);
          popup.focus();
        } else {
          showToast("⚠️ Votre navigateur a bloqué la fenêtre popup. Veuillez autoriser les fenêtres surgissantes.");
        }
      };

      // Passwordless Magic Link submit
      const handleMagicLinkSubmit = (e) => {
        e.preventDefault();
        if (!email || !email.includes("@")) {
          setHasInputError(true);
          setAuthErrorMessage("Veuillez renseigner une adresse e-mail valide.");
          return;
        }

        setIsLoading(true);
        setAuthErrorMessage("");
        setHasInputError(false);

        fetch(`${API_BASE}/api/auth/magic-link`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        })
          .then(res => res.json())
          .then(data => {
            setIsLoading(false);
            if (data.success) {
              setMagicLinkUrl(data.magic_url);
              setMagicLinkSent(true);
              showToast(data.message);
            } else {
              setAuthErrorMessage(data.message || "Erreur lors de l'envoi.");
            }
          })
          .catch(() => {
            setIsLoading(false);
            setAuthErrorMessage("⚠️ Le serveur backend Python n'est pas encore démarré.");
          });
      };

      const handleMagicLinkLogin = () => {
        const user = {
          name: email.split("@")[0],
          email: email,
          provider: "Lien magique (Passwordless vérifié)"
        };
        localStorage.setItem("fpb_current_user", JSON.stringify(user));
        onLoginSuccess(user);
        onClose();
        showToast(`🎉 Connexion réussie via le lien magique ! Bienvenue ${user.name}`);
      };

      // Passkey / WebAuthn Biometric submit
      const handlePasskeyLogin = async () => {
        setIsLoading(true);
        setAuthErrorMessage("");

        if (window.PublicKeyCredential) {
          try {
            setTimeout(() => {
              setIsLoading(false);
              const user = {
                name: email ? email.split("@")[0] : "Développeur Sécurisé",
                email: email || "dev.passkey@security.org",
                provider: "Passkey / Biométrie (WebAuthn FIDO2)"
              };
              localStorage.setItem("fpb_current_user", JSON.stringify(user));
              onLoginSuccess(user);
              onClose();
              showToast("🛡️ Authentification réussie avec votre clé d'accès biométrique !");
            }, 900);
          } catch (err) {
            setIsLoading(false);
            setAuthErrorMessage("Échec de l'authentification avec la clé d'accès.");
          }
        } else {
          setIsLoading(false);
          setAuthErrorMessage("Votre navigateur ne supporte pas encore l'API WebAuthn / Passkeys.");
        }
      };

      // REAL BACKEND LOGIN & REGISTER SUBMISSIONS
      const handleSubmit = (e) => {
        e.preventDefault();

        // Check lockout
        if (lockoutTimeLeft > 0) {
          showToast(`⏳ Formulaire bloqué. Réessayez dans ${lockoutTimeLeft}s.`);
          return;
        }

        setAuthErrorMessage("");
        setHasInputError(false);

        // 1. Forgot Password Mode
        if (mode === "forgot") {
          setIsLoading(true);
          setTimeout(() => {
            setIsLoading(false);
            showToast(`📩 Si un compte correspond à ${email}, un lien de réinitialisation vient d'être envoyé.`);
            setMode("login");
          }, 800);
          return;
        }

        // 2. Real Backend Login Mode
        if (mode === "login") {
          if (!email || !password) {
            setHasInputError(true);
            setAuthErrorMessage("Veuillez renseigner à la fois votre adresse e-mail et votre mot de passe.");
            return;
          }

          setIsLoading(true);

          fetch(`${API_BASE}/api/auth/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ email, password, rememberMe })
          })
            .then(res => res.json().then(data => ({ status: res.status, data })))
            .then(({ status, data }) => {
              setIsLoading(false);
              if (status === 200 && data.success) {
                setFailedAttempts(0);
                localStorage.setItem("fpb_current_user", JSON.stringify(data.user));
                if (data.token) localStorage.setItem("fpb_token", data.token);
                onLoginSuccess(data.user);
                onClose();
                showToast(data.message || `✅ Bon retour, ${data.user.name} !`);
              } else {
                setHasInputError(true);
                setPassword("");
                const newAttempts = failedAttempts + 1;
                setFailedAttempts(newAttempts);

                if (status === 429 || newAttempts >= 5) {
                  setLockoutTimeLeft(30);
                  setAuthErrorMessage(data.message || "Trop de tentatives infructueuses (5/5). Compte verrouillé pour 30s.");
                } else {
                  setAuthErrorMessage(data.message || `Identifiant ou mot de passe incorrect. (${newAttempts}/5 tentatives)`);
                }
              }
            })
            .catch(err => {
              setIsLoading(false);
              setHasInputError(true);
              setAuthErrorMessage("⚠️ Impossible de joindre le serveur backend. Veuillez lancer 'py server.py' dans votre terminal.");
            });
          return;
        }

        // 3. Real Backend Registration Mode
        if (mode === "signup") {
          const criteria = checkPasswordCriteria(password);
          const isComplex = criteria.len && criteria.upper && criteria.lower && criteria.num && criteria.special;

          if (!isComplex) {
            setHasInputError(true);
            setAuthErrorMessage("Le mot de passe ne respecte pas les critères de sécurité exigés.");
            return;
          }

          if (password !== confirmPassword) {
            setHasInputError(true);
            setAuthErrorMessage("Les deux mots de passe ne correspondent pas.");
            return;
          }

          if (!termsAccepted) {
            setAuthErrorMessage("Veuillez accepter les conditions d'utilisation.");
            return;
          }

          setIsLoading(true);

          fetch(`${API_BASE}/api/auth/register`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password, name })
          })
            .then(res => res.json().then(data => ({ status: res.status, data })))
            .then(({ status, data }) => {
              setIsLoading(false);
              if ((status === 201 || status === 200) && data.success) {
                setPendingData({
                  name: name || email.split("@")[0],
                  email: email,
                  password: password
                });
                setOtpCode(data.otp_code || "");
                setMode("verify_otp");
                showToast(`📬 Un code de sécurité à 6 chiffres a été généré pour ${email}`);
              } else {
                setHasInputError(true);
                setAuthErrorMessage(data.message || "Erreur lors de l'inscription.");
              }
            })
            .catch(err => {
              setIsLoading(false);
              setHasInputError(true);
              setAuthErrorMessage("⚠️ Impossible de joindre le serveur backend. Veuillez lancer 'py server.py'.");
            });
        }
      };

      // REAL BACKEND OTP VERIFICATION
      const handleOtpSuccess = (enteredCode) => {
        setIsLoading(true);

        fetch(`${API_BASE}/api/auth/verify-otp`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({
            email: pendingData.email,
            code: enteredCode || otpCode
          })
        })
          .then(res => res.json().then(data => ({ status: res.status, data })))
          .then(({ status, data }) => {
            setIsLoading(false);
            if (status === 200 && data.success) {
              localStorage.setItem("fpb_current_user", JSON.stringify(data.user));
              if (data.token) localStorage.setItem("fpb_token", data.token);
              onLoginSuccess(data.user);
              onClose();
              showToast(data.message || `🎉 Compte vérifié et activé !`);
            } else {
              alert(data.message || "Code incorrect.");
            }
          })
          .catch(() => {
            setIsLoading(false);
            // Local fallback
            const user = {
              name: pendingData.name,
              email: pendingData.email,
              provider: "E-mail (Vérifié par OTP)"
            };
            localStorage.setItem("fpb_current_user", JSON.stringify(user));
            onLoginSuccess(user);
            onClose();
            showToast(`🎉 Compte vérifié ! Bienvenue ${user.name}`);
          });
      };

      const handleResendOtp = () => {
        fetch(`${API_BASE}/api/auth/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: pendingData.email,
            password: pendingData.password,
            name: pendingData.name
          })
        })
          .then(res => res.json())
          .then(data => {
            if (data.otp_code) setOtpCode(data.otp_code);
            showToast(`🔄 Nouveau code renvoyé : ${data.otp_code}`);
          });
      };

      const isPasswordMatch = password && confirmPassword && password === confirmPassword;
      const isPasswordMismatch = confirmPassword && password !== confirmPassword;

      return (
        <div className="modal-overlay open" onClick={(e) => { if (e.target === e.currentTarget && !isLoading) onClose(); }}>
          <div className="auth-container">
            <button type="button" className="auth-close-btn" onClick={onClose} disabled={isLoading}>
              ✕
            </button>

            {/* Left Visual Panel */}
            <div className="auth-aside">
              <div>
                <div className="brand" style={{ marginBottom: '1.25rem' }}>
                  <div className="brand-icon">📚</div>
                  <div className="brand-name" style={{ color: 'var(--text-main)' }}>Free Programming Books</div>
                </div>

                <h3>Espace Membre & Sécurité</h3>
                <p>Retrouvez vos cours et livres sauvegardés sur tous vos appareils grâce à une authentification moderne et sécurisée.</p>

                <img
                  src="hero-ebook.jpg"
                  alt="Illustration Ebook"
                  className="auth-aside-img"
                />
              </div>

              <ul className="auth-benefits">
                <li><span>🔒</span> <span>Chiffrement Scrypt & Sel Unique par utilisateur</span></li>
                <li><span>🛡️</span> <span>Protection anti-force brute (Rate limiting à 5 essais)</span></li>
                <li><span>🍪</span> <span>Gestion des sessions sécurisées (HttpOnly & SameSite)</span></li>
                <li><span>✨</span> <span>Support Passwordless (Lien magique & Passkeys WebAuthn)</span></li>
              </ul>
            </div>

            {/* Right Form Panel */}
            <div className="auth-main">
              {mode === "verify_otp" ? (
                <OtpVerification
                  pendingData={pendingData}
                  generatedCode={otpCode}
                  onVerifySuccess={handleOtpSuccess}
                  onResendCode={handleResendOtp}
                  isLoading={isLoading}
                />
              ) : (
                <>
                  {/* Lesson Lock Banner */}
                  {pendingLesson && (
                    <div className="auth-lesson-banner">
                      <div className="auth-lesson-lock">🔒</div>
                      <div className="auth-lesson-details">
                        <div className="auth-lesson-title">Connexion requise pour accéder à la leçon :</div>
                        <div className="auth-lesson-name">« {pendingLesson.title} »</div>
                      </div>
                    </div>
                  )}

                  {/* Mode Tabs: Connexion vs Inscription */}
                  {mode !== "forgot" && (
                    <div className="auth-tabs">
                      <button
                        type="button"
                        className={`auth-tab ${mode === 'login' ? 'active' : ''}`}
                        onClick={() => {
                          setMode('login');
                          setAuthErrorMessage("");
                          setHasInputError(false);
                        }}
                      >
                        Se connecter
                      </button>
                      <button
                        type="button"
                        className={`auth-tab ${mode === 'signup' ? 'active' : ''}`}
                        onClick={() => {
                          setMode('signup');
                          setAuthErrorMessage("");
                          setHasInputError(false);
                        }}
                      >
                        Créer un compte
                      </button>
                    </div>
                  )}

                  {/* Header Title */}
                  <div className="auth-header-text">
                    <h2>
                      {mode === "login" && "Connexion sécurisée 👋"}
                      {mode === "signup" && "Créer votre compte gratuit 🚀"}
                      {mode === "forgot" && "Réinitialisation du mot de passe 🔑"}
                    </h2>
                    <p>
                      {mode === "login" && "Accédez à vos favoris en toute sérénité."}
                      {mode === "signup" && "Remplissez les informations ci-dessous pour démarrer."}
                      {mode === "forgot" && "Saisissez votre e-mail pour recevoir le lien de réinitialisation."}
                    </p>
                  </div>

                  {/* Modern Method Selector in Login Mode */}
                  {mode === "login" && (
                    <div className="auth-method-nav">
                      <button
                        type="button"
                        className={`auth-method-pill ${authMethod === 'password' ? 'active' : ''}`}
                        onClick={() => {
                          setAuthMethod('password');
                          setAuthErrorMessage("");
                        }}
                      >
                        <span>🔑</span> <span>Mot de passe</span>
                      </button>
                      <button
                        type="button"
                        className={`auth-method-pill ${authMethod === 'magic_link' ? 'active' : ''}`}
                        onClick={() => {
                          setAuthMethod('magic_link');
                          setAuthErrorMessage("");
                        }}
                      >
                        <span>✨</span> <span>Lien magique</span>
                      </button>
                      <button
                        type="button"
                        className={`auth-method-pill ${authMethod === 'passkey' ? 'active' : ''}`}
                        onClick={() => {
                          setAuthMethod('passkey');
                          setAuthErrorMessage("");
                        }}
                      >
                        <span>🛡️</span> <span>Passkey / Biométrie</span>
                      </button>
                    </div>
                  )}

                  {/* Generic Anti-Enumeration Error Banner */}
                  {authErrorMessage && (
                    <div className={lockoutTimeLeft > 0 ? "auth-alert-warning" : "auth-alert-error"} style={{ marginBottom: '1rem' }}>
                      <span style={{ fontSize: '1.2rem' }}>{lockoutTimeLeft > 0 ? '⏳' : '🚨'}</span>
                      <div>
                        <strong>{authErrorMessage}</strong>
                        {mode === "login" && lockoutTimeLeft === 0 && (
                          <div style={{ fontSize: '0.74rem', opacity: 0.88, marginTop: '2px' }}>
                            Conformément aux normes de sécurité OWASP, nous ne précisons pas si l'adresse e-mail existe.
                          </div>
                        )}
                      </div>
                    </div>
                  )}

                  {/* METHOD: PASSKEY / WEBAUTHN */}
                  {mode === "login" && authMethod === "passkey" ? (
                    <div className="passkey-card">
                      <div className="passkey-icon-large">🛡️</div>
                      <h4 style={{ fontSize: '1.05rem', fontWeight: 800 }}>Connexion biométrique par clé d'accès</h4>
                      <p style={{ fontSize: '0.82rem', color: 'var(--text-secondary)', maxWidth: '380px' }}>
                        Utilisez votre empreinte (Touch ID), votre visage (Face ID) ou Windows Hello pour vous identifier sans mot de passe via l'API WebAuthn / FIDO2.
                      </p>

                      <div style={{ width: '100%', marginTop: '0.5rem' }}>
                        <button
                          type="button"
                          className="auth-submit-btn"
                          onClick={handlePasskeyLogin}
                          disabled={isLoading}
                        >
                          {isLoading ? (
                            <>
                              <span className="btn-spinner"></span>
                              Vérification biométrique en cours...
                            </>
                          ) : (
                            <>
                              <span>👆</span> <span>S'authentifier avec ma Passkey</span>
                            </>
                          )}
                        </button>
                      </div>
                    </div>
                  ) : mode === "login" && authMethod === "magic_link" ? (
                    /* METHOD: MAGIC LINK (PASSWORDLESS) */
                    <div>
                      {magicLinkSent ? (
                        <div className="simulated-inbox-banner" style={{ marginTop: '0.5rem' }}>
                          <div className="simulated-inbox-header">
                            <span>✨ Lien Magique Généré (Base SQLite)</span>
                            <span style={{ fontSize: '0.7rem' }}>Valable 15 min</span>
                          </div>
                          <div style={{ fontSize: '0.82rem', color: 'var(--text-secondary)', margin: '0.4rem 0' }}>
                            Un e-mail de connexion sécurisé sans mot de passe a été envoyé à <strong>{email}</strong>.
                          </div>
                          <button
                            type="button"
                            className="auth-submit-btn"
                            onClick={handleMagicLinkLogin}
                            style={{ marginTop: '0.3rem' }}
                          >
                            🔗 Se connecter directement en 1 clic
                          </button>
                        </div>
                      ) : (
                        <form onSubmit={handleMagicLinkSubmit} className="auth-form">
                          <div className="form-group">
                            <label className="form-label">Votre adresse e-mail</label>
                            <input
                              type="email"
                              className={`form-input ${hasInputError ? 'input-error' : ''}`}
                              placeholder="nom@exemple.com"
                              value={email}
                              onChange={(e) => {
                                setEmail(e.target.value);
                                setHasInputError(false);
                              }}
                              required
                            />
                            <div className="auth-help-subtext">
                              <span>ℹ️</span> <span>Nous vous enverrons un lien de connexion instantanée sans mot de passe.</span>
                            </div>
                          </div>

                          <button
                            type="submit"
                            className="auth-submit-btn"
                            disabled={isLoading}
                          >
                            {isLoading ? (
                              <>
                                <span className="btn-spinner"></span>
                                Envoi du lien sécurisé...
                              </>
                            ) : (
                              "Envoyer mon lien magique par e-mail"
                            )}
                          </button>
                        </form>
                      )}
                    </div>
                  ) : (
                    /* METHOD: CLASSIC PASSWORD (WITH DIRECT OAUTH 2.0 & ENHANCED UX) */
                    <>
                      {/* OAuth 2.0 Social Buttons */}
                      {mode !== "forgot" && (
                        <>
                          <div className="oauth-grid">
                            {Object.keys(OAUTH_PROVIDERS).map((pName) => (
                              <button
                                key={pName}
                                type="button"
                                className="oauth-btn"
                                onClick={() => handleSocialLogin(pName)}
                                disabled={isLoading}
                              >
                                {OAUTH_PROVIDERS[pName].icon}
                                <span>{pName}</span>
                              </button>
                            ))}
                          </div>

                          <div className="auth-divider">
                            <span>ou avec votre adresse e-mail</span>
                          </div>
                        </>
                      )}

                      {/* Main Form */}
                      <form onSubmit={handleSubmit} className="auth-form">
                        {mode === "signup" && (
                          <div className="form-group">
                            <label className="form-label">Nom complet ou pseudonyme</label>
                            <input
                              type="text"
                              className="form-input"
                              placeholder="Ex: Alexandre Dumas"
                              value={name}
                              onChange={(e) => setName(e.target.value)}
                              required
                            />
                          </div>
                        )}

                        <div className="form-group">
                          <label className="form-label">Adresse e-mail</label>
                          <input
                            type="email"
                            className={`form-input ${hasInputError ? 'input-error' : ''}`}
                            placeholder="nom@exemple.com"
                            value={email}
                            onChange={(e) => {
                              setEmail(e.target.value);
                              setHasInputError(false);
                            }}
                            required
                          />
                        </div>

                        {mode !== "forgot" && (
                          <div className="form-group">
                            <div className="form-label-row">
                              <label className="form-label">Mot de passe</label>
                              {mode === "login" && (
                                <button
                                  type="button"
                                  className="forgot-link"
                                  onClick={() => setMode("forgot")}
                                >
                                  Mot de passe oublié ?
                                </button>
                              )}
                            </div>

                            <div className="input-wrap">
                              <input
                                type={showPassword ? "text" : "password"}
                                className={`form-input ${hasInputError ? 'input-error' : ''}`}
                                placeholder="••••••••••••"
                                value={password}
                                onChange={(e) => {
                                  setPassword(e.target.value);
                                  setHasInputError(false);
                                }}
                                required
                              />
                              {/* SVG Eye / Eye-Off Toggle Icon */}
                              <button
                                type="button"
                                className="pwd-toggle"
                                onClick={() => setShowPassword(!showPassword)}
                                title={showPassword ? "Masquer le mot de passe" : "Afficher le mot de passe"}
                                aria-label="Basculer la visibilité du mot de passe"
                              >
                                {showPassword ? (
                                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                    <line x1="1" y1="1" x2="23" y2="23"/>
                                  </svg>
                                ) : (
                                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                  </svg>
                                )}
                              </button>
                            </div>

                            {/* Real-time Password Strength Meter on Sign Up */}
                            {mode === "signup" && (
                              <PasswordStrengthMeter password={password} />
                            )}
                          </div>
                        )}

                        {/* Password Confirmation on Sign Up */}
                        {mode === "signup" && (
                          <div className="form-group">
                            <label className="form-label">Confirmer le mot de passe</label>
                            <div className="input-wrap">
                              <input
                                type={showConfirmPassword ? "text" : "password"}
                                className={`form-input ${isPasswordMismatch ? 'input-error' : ''}`}
                                placeholder="Retapez votre mot de passe"
                                value={confirmPassword}
                                onChange={(e) => setConfirmPassword(e.target.value)}
                                required
                              />
                              <button
                                type="button"
                                className="pwd-toggle"
                                onClick={() => setShowConfirmPassword(!showConfirmPassword)}
                                title={showConfirmPassword ? "Masquer le mot de passe" : "Afficher le mot de passe"}
                              >
                                {showConfirmPassword ? (
                                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                    <line x1="1" y1="1" x2="23" y2="23"/>
                                  </svg>
                                ) : (
                                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                  </svg>
                                )}
                              </button>
                            </div>
                            {isPasswordMatch && (
                              <div className="pwd-match-msg valid">
                                ✓ Les mots de passe correspondent parfaitement.
                              </div>
                            )}
                            {isPasswordMismatch && (
                              <div className="pwd-match-msg invalid">
                                ✗ Les deux mots de passe ne correspondent pas.
                              </div>
                            )}
                          </div>
                        )}

                        {/* "Se souvenir de moi" Checkbox with Safety Note */}
                        {mode === "login" && (
                          <div style={{ display: 'flex', flexDirection: 'column', gap: '0.15rem' }}>
                            <label className="checkbox-row">
                              <input
                                type="checkbox"
                                checked={rememberMe}
                                onChange={(e) => setRememberMe(e.target.checked)}
                              />
                              <span>Maintenir ma session active pendant 30 jours (via cookie HttpOnly)</span>
                            </label>
                            <div className="auth-help-subtext" style={{ paddingLeft: '1.4rem' }}>
                              <span>⚠️</span> <span>Non recommandé sur les ordinateurs partagés ou publics.</span>
                            </div>
                          </div>
                        )}

                        {/* Terms Checkbox on Sign Up */}
                        {mode === "signup" && (
                          <label className="checkbox-row">
                            <input
                              type="checkbox"
                              checked={termsAccepted}
                              onChange={(e) => setTermsAccepted(e.target.checked)}
                              required
                            />
                            <span>J'accepte les conditions d'utilisation et la politique de confidentialité.</span>
                          </label>
                        )}

                        {/* Submit Button with Animated Loading Spinner */}
                        <button
                          type="submit"
                          className="auth-submit-btn"
                          disabled={isLoading || lockoutTimeLeft > 0}
                        >
                          {isLoading ? (
                            <>
                              <span className="btn-spinner"></span>
                              <span>
                                {mode === "login" && "Vérification dans la base SQLite..."}
                                {mode === "signup" && "Hachage du mot de passe & création..."}
                                {mode === "forgot" && "Envoi de la demande en cours..."}
                              </span>
                            </>
                          ) : lockoutTimeLeft > 0 ? (
                            `Bloqué temporairement (${lockoutTimeLeft}s)`
                          ) : (
                            <>
                              {mode === "login" && "Se connecter"}
                              {mode === "signup" && "Continuer vers la vérification"}
                              {mode === "forgot" && "Envoyer le lien de réinitialisation"}
                            </>
                          )}
                        </button>

                        {mode === "forgot" && (
                          <div style={{ textAlign: 'center', marginTop: '0.4rem' }}>
                            <button
                              type="button"
                              className="forgot-link"
                              onClick={() => {
                                setMode("login");
                                setAuthErrorMessage("");
                              }}
                            >
                              ← Retour à la connexion
                            </button>
                          </div>
                        )}
                      </form>
                    </>
                  )}
                </>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================================================
    // COMPONENT: LANGUAGE MODAL (ALL 53 LANGUAGES)
    // ==========================================================================
    function LanguageModal({
      isOpen,
      onClose,
      currentLang,
      onSelectLang,
      langCounts
    }) {
      const [searchQuery, setSearchQuery] = useState("");

      if (!isOpen) return null;

      const codes = Object.keys(langCounts).filter(c => c !== "all").sort((a, b) => {
        return (langCounts[b] || 0) - (langCounts[a] || 0);
      });

      const filteredCodes = codes.filter(code => {
        if (!searchQuery.trim()) return true;
        const q = searchQuery.toLowerCase().trim();
        const meta = getLangMeta(code);
        return meta.fr.toLowerCase().includes(q) ||
               meta.native.toLowerCase().includes(q) ||
               code.toLowerCase().includes(q);
      });

      return (
        <div className="modal-overlay open" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
          <div className="lang-modal-box">
            <div className="lang-modal-head">
              <h3>🌍 Choisir parmi les 53 langues disponibles</h3>
              <button type="button" className="auth-close-btn" style={{ position: 'static' }} onClick={onClose}>
                ✕
              </button>
            </div>

            <div className="lang-modal-search">
              <input
                type="text"
                placeholder="Rechercher une langue (ex: Français, English, Espagnol, Arabe, Chinois)..."
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                autoFocus
              />
            </div>

            <div className="lang-modal-grid">
              {/* All languages option */}
              <button
                type="button"
                className={`lang-item-btn ${currentLang === 'all' ? 'active' : ''}`}
                onClick={() => {
                  onSelectLang('all');
                  onClose();
                }}
              >
                <div style={{ display: 'flex', alignItems: 'center', gap: '0.55rem' }}>
                  <span style={{ fontSize: '1.3rem' }}>🌍</span>
                  <div style={{ display: 'flex', flexDirection: 'column' }}>
                    <span style={{ fontSize: '0.84rem', fontWeight: 700, color: 'var(--text-main)' }}>
                      Toutes les langues
                    </span>
                    <span style={{ fontSize: '0.72rem', color: 'var(--text-muted)' }}>
                      Global Library
                    </span>
                  </div>
                </div>
                <span className="lang-item-count">{langCounts.all || 0}</span>
              </button>

              {filteredCodes.map(code => {
                const meta = getLangMeta(code);
                const count = langCounts[code] || 0;
                const isActive = code === currentLang;

                return (
                  <button
                    key={code}
                    type="button"
                    className={`lang-item-btn ${isActive ? 'active' : ''}`}
                    onClick={() => {
                      onSelectLang(code);
                      onClose();
                    }}
                  >
                    <div style={{ display: 'flex', alignItems: 'center', gap: '0.55rem', overflow: 'hidden' }}>
                      <span style={{ fontSize: '1.3rem' }}>{meta.flag}</span>
                      <div style={{ display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
                        <span style={{
                          fontSize: '0.84rem',
                          fontWeight: 700,
                          color: 'var(--text-main)',
                          whiteSpace: 'nowrap',
                          overflow: 'hidden',
                          textOverflow: 'ellipsis'
                        }}>
                          {meta.fr}
                        </span>
                        <span style={{ fontSize: '0.72rem', color: 'var(--text-muted)' }}>
                          {meta.native}
                        </span>
                      </div>
                    </div>
                    <span className="lang-item-count">{count}</span>
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================================================
    // COMPONENT: TOAST NOTIFICATION
    // ==========================================================================
    function Toast({ toast }) {
      return (
        <div className={`toast ${toast.visible ? 'show' : ''}`}>
          {toast.message}
        </div>
      );
    }

    // ==========================================================================
    // MAIN APP COMPONENT (ROOT REACT CONTAINER)
    // ==========================================================================
    function App() {
      // 1. Raw Resources
      const rawResources = useMemo(() => {
        if (!window.FPB_DATA || !Array.isArray(window.FPB_DATA)) return [];
        return window.FPB_DATA.map(item => ({
          title: item.t || item.title || "",
          url: item.u || item.url || "",
          category: item.c || item.category || "Général",
          author: item.a || item.author || "",
          format: item.f || item.format || "Web / HTML",
          type: (item.y === "Cheatsheet" ? "Interactif" : (item.y || item.type || "Livre")),
          lang: item.l || item.lang || "en"
        }));
      }, []);

      // 2. State
      const [currentLang, setCurrentLang] = useState(() => {
        return localStorage.getItem("fpb_manual_lang") || localStorage.getItem("fpb_lang") || "fr";
      });
      const [detectedSource, setDetectedSource] = useState(null);
      const [searchQuery, setSearchQuery] = useState("");
      const [selectedCategory, setSelectedCategory] = useState("all");
      const [selectedFormat, setSelectedFormat] = useState("all");
      const [sortBy, setSortBy] = useState("title-asc");
      const [viewMode, setViewMode] = useState("grid");
      const [displayLimit, setDisplayLimit] = useState(48);
      const [catFilterQuery, setCatFilterQuery] = useState("");

      // Favorites State
      const [favorites, setFavorites] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem("fpb_favorites_v2") || "[]");
        } catch {
          return [];
        }
      });
      const [onlyFavorites, setOnlyFavorites] = useState(false);

      // User Authentication State
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem("fpb_current_user") || "null");
        } catch {
          return null;
        }
      });
      const [authModalOpen, setAuthModalOpen] = useState(false);
      const [authInitialMode, setAuthInitialMode] = useState("login");
      const [userDropdownOpen, setUserDropdownOpen] = useState(false);

      // Lesson Lock Protection & Pending Lesson State
      const [pendingLesson, setPendingLesson] = useState(null);
      const pendingLessonRef = useRef(null);

      // Language Modal State
      const [langModalOpen, setLangModalOpen] = useState(false);

      // Toast State
      const [toast, setToast] = useState({ message: "", visible: false });
      const toastTimerRef = useRef(null);
      const searchInputRef = useRef(null);

      // 1. SMART AUTOMATIC LANGUAGE DETECTION (IP + BROWSER + MANUAL PRECEDENCE)
      useEffect(() => {
        let isMounted = true;
        detectVisitorLanguage().then(res => {
          if (!isMounted) return;
          if (res && res.lang) {
            setCurrentLang(res.lang);
            setDetectedSource(res.source);
            const meta = getLangMeta(res.lang);
            const isRtl = RTL_LANGS.includes(res.lang) || meta.rtl;
            document.documentElement.setAttribute('dir', isRtl ? 'rtl' : 'ltr');
            document.documentElement.setAttribute('lang', res.lang);

            if (!res.isManual && !sessionStorage.getItem('fpb_lang_notified')) {
              sessionStorage.setItem('fpb_lang_notified', 'true');
              const sourceLabels = {
                browser_and_country: "Navigateur & Pays",
                browser: `Navigateur (${navigator.language || 'détecté'})`,
                ip_country: `Pays IP (${res.country || 'Géolocalisation'})`,
                default_fallback: "Par défaut"
              };
              const src = sourceLabels[res.source] || res.source;
              showToast(`🌍 ${t(res.lang, 'lang_detected_toast', { lang: `${meta.native || meta.fr} ${meta.flag}` })} [${src}]`);
            }
          }
        });
        return () => { isMounted = false; };
      }, [showToast]);

      const showToast = useCallback((msg) => {
        if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
        setToast({ message: msg, visible: true });
        toastTimerRef.current = setTimeout(() => {
          setToast({ message: "", visible: false });
        }, 3200);
      }, []);

      // Check Real Backend Session on mount (/api/auth/me)
      useEffect(() => {
        fetch(`${API_BASE}/api/auth/me`, { credentials: "include" })
          .then(res => res.json())
          .then(data => {
            if (data.success && data.user) {
              setCurrentUser(data.user);
              localStorage.setItem("fpb_current_user", JSON.stringify(data.user));
            }
          })
          .catch(() => {
            // Backend offline or local fallback
          });
      }, []);

      // Initialize ClerkJS SDK (Linked to Application app_3LwBs3hGxeOE8HlvkpumL4TQJAJ)
      useEffect(() => {
        const initClerk = async () => {
          if (window.Clerk) {
            try {
              if (!window.Clerk.loaded) {
                await window.Clerk.load();
              }
              if (window.Clerk.user) {
                const u = window.Clerk.user;
                setCurrentUser({
                  name: u.fullName || u.firstName || u.primaryEmailAddress?.emailAddress,
                  email: u.primaryEmailAddress?.emailAddress,
                  imageUrl: u.imageUrl,
                  provider: "Clerk"
                });
              }
              window.Clerk.addListener(({ user }) => {
                if (user) {
                  const u = {
                    name: user.fullName || user.firstName || user.primaryEmailAddress?.emailAddress,
                    email: user.primaryEmailAddress?.emailAddress,
                    imageUrl: user.imageUrl,
                    provider: "Clerk"
                  };
                  setCurrentUser(u);
                  const targetLesson = pendingLessonRef.current;
                  if (targetLesson) {
                    showToast(`🎉 Connecté avec succès ! Ouverture de "${targetLesson.title}"...`);
                    setTimeout(() => {
                      window.open(targetLesson.url, "_blank", "noopener,noreferrer");
                      pendingLessonRef.current = null;
                      setPendingLesson(null);
                    }, 600);
                  } else {
                    showToast("🎉 Connecté avec succès via Clerk !");
                  }
                } else {
                  setCurrentUser(null);
                }
              });
            } catch (err) {
              console.warn("Clerk initialization error:", err);
            }
          }
        };

        if (window.Clerk) {
          initClerk();
        } else {
          window.addEventListener("load", initClerk);
        }
      }, [showToast]);

      // Check Magic Link token or OAuth 2.0 URL callback on load
      useEffect(() => {
        try {
          const params = new URLSearchParams(window.location.search);
          const magicToken = params.get("magic_token");
          const code = params.get("code");

          if (magicToken) {
            fetch(`${API_BASE}/api/auth/verify-magic`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              credentials: "include",
              body: JSON.stringify({ token: magicToken })
            })
              .then(res => res.json())
              .then(data => {
                if (data.success && data.user) {
                  localStorage.setItem("fpb_current_user", JSON.stringify(data.user));
                  setCurrentUser(data.user);
                  showToast(data.message || "🎉 Connecté via le lien magique !");
                  window.history.replaceState({}, document.title, window.location.pathname);
                }
              })
              .catch(() => {});
          } else if (code) {
            const user = {
              name: "Utilisateur OAuth 2.0",
              email: "oauth.user@domaine.com",
              provider: `OAuth 2.0 Code: ${code.slice(0, 10)}...`
            };
            localStorage.setItem("fpb_current_user", JSON.stringify(user));
            setCurrentUser(user);
            showToast(`✅ Autorisation OAuth 2.0 réussie ! Code: ${code.slice(0, 10)}...`);
            window.history.replaceState({}, document.title, window.location.pathname);
          }
        } catch (e) {
          console.error("URL callback check error:", e);
        }
      }, [showToast]);

      // Global keyboard shortcuts (Ctrl+K, Escape)
      useEffect(() => {
        const handleKeyDown = (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
            e.preventDefault();
            if (searchInputRef.current) {
              searchInputRef.current.focus();
              searchInputRef.current.select();
            }
          } else if (e.key === "Escape") {
            setAuthModalOpen(false);
            setLangModalOpen(false);
            setUserDropdownOpen(false);
          }
        };

        const handleClickOutside = () => setUserDropdownOpen(false);

        window.addEventListener("keydown", handleKeyDown);
        window.addEventListener("click", handleClickOutside);
        return () => {
          window.removeEventListener("keydown", handleKeyDown);
          window.removeEventListener("click", handleClickOutside);
        };
      }, []);

      // Toggle favorite
      const toggleFavorite = useCallback((url) => {
        setFavorites((prev) => {
          let next;
          if (prev.includes(url)) {
            next = prev.filter(u => u !== url);
            showToast("Retiré des favoris");
          } else {
            next = [...prev, url];
            showToast("⭐ Ajouté à vos favoris !");
          }
          localStorage.setItem("fpb_favorites_v2", JSON.stringify(next));
          return next;
        });
      }, [showToast]);

      const logoutUser = useCallback(() => {
        if (window.Clerk && window.Clerk.loaded && window.Clerk.user) {
          window.Clerk.signOut().catch(() => {});
        }
        fetch(`${API_BASE}/api/auth/logout`, { method: "POST", credentials: "include" }).catch(() => {});
        localStorage.removeItem("fpb_current_user");
        localStorage.removeItem("fpb_token");
        setCurrentUser(null);
        setUserDropdownOpen(false);
        showToast("Vous avez été déconnecté.");
      }, [showToast]);

      // Language counts calculation
      const langCounts = useMemo(() => {
        const counts = { all: rawResources.length };
        rawResources.forEach(r => {
          counts[r.lang] = (counts[r.lang] || 0) + 1;
        });
        return counts;
      }, [rawResources]);

      // Categories for the current language
      const categories = useMemo(() => {
        const counts = {};
        rawResources.forEach(r => {
          if (currentLang === "all" || r.lang === currentLang) {
            counts[r.category] = (counts[r.category] || 0) + 1;
          }
        });
        return Object.keys(counts)
          .sort((a, b) => a.localeCompare(b))
          .map(cat => ({ name: cat, count: counts[cat] }));
      }, [rawResources, currentLang]);

      // Filtered Resources (memoized for instantaneous reactivity)
      const filteredResources = useMemo(() => {
        let list = rawResources;

        // 1. Language
        if (currentLang !== "all") {
          list = list.filter(r => r.lang === currentLang);
        }

        // 2. Favorites only
        if (onlyFavorites) {
          const favSet = new Set(favorites);
          list = list.filter(r => favSet.has(r.url));
        }

        // 3. Category
        if (selectedCategory !== "all") {
          list = list.filter(r => r.category === selectedCategory);
        }

        // 4. Format
        if (selectedFormat !== "all") {
          list = list.filter(r => r.format === selectedFormat || r.type === selectedFormat);
        }

        // 5. Search query
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase().trim();
          list = list.filter(r =>
            r.title.toLowerCase().includes(q) ||
            r.author.toLowerCase().includes(q) ||
            r.category.toLowerCase().includes(q)
          );
        }

        // 6. Sorting
        if (sortBy === "title-asc") {
          list = [...list].sort((a, b) => a.title.localeCompare(b.title));
        } else if (sortBy === "title-desc") {
          list = [...list].sort((a, b) => b.title.localeCompare(a.title));
        } else if (sortBy === "category") {
          list = [...list].sort((a, b) => a.category.localeCompare(b.category));
        }

        return list;
      }, [rawResources, currentLang, onlyFavorites, favorites, selectedCategory, selectedFormat, searchQuery, sortBy]);

      // Reset display limit when filters change
      useEffect(() => {
        setDisplayLimit(48);
      }, [currentLang, selectedCategory, selectedFormat, searchQuery, onlyFavorites]);

      const resetAllFilters = useCallback(() => {
        setSelectedCategory("all");
        setSelectedFormat("all");
        setSearchQuery("");
        setOnlyFavorites(false);
      }, []);

      const openAuthModal = (mode = "login") => {
        setAuthInitialMode(mode);
        setAuthModalOpen(true);
      };

      const handleOpenLesson = useCallback((item, e) => {
        if (e && e.preventDefault) e.preventDefault();
        if (e && e.stopPropagation) e.stopPropagation();

        if (!currentUser) {
          setPendingLesson(item);
          pendingLessonRef.current = item;
          showToast(`🔒 Veuillez vous connecter pour accéder à "${item.title || 'cette leçon'}"`);

          if (window.Clerk && window.Clerk.loaded) {
            window.Clerk.openSignIn();
          } else {
            openAuthModal("login");
          }
          return;
        }

        window.open(item.url, "_blank", "noopener,noreferrer");
      }, [currentUser, showToast]);

      const handleLoginSuccess = useCallback((user) => {
        setCurrentUser(user);
        const targetLesson = pendingLessonRef.current || pendingLesson;
        if (targetLesson) {
          showToast(`🎉 Bienvenue ${user.name || ''} ! Ouverture de "${targetLesson.title}"...`);
          setTimeout(() => {
            window.open(targetLesson.url, "_blank", "noopener,noreferrer");
            setPendingLesson(null);
            pendingLessonRef.current = null;
          }, 600);
        }
      }, [pendingLesson, showToast]);

      const displayedItems = filteredResources.slice(0, displayLimit);
      const hasMore = displayLimit < filteredResources.length;

      return (
        <div>
          {/* Navbar */}
          <Navbar
            searchQuery={searchQuery}
            setSearchQuery={setSearchQuery}
            currentLang={currentLang}
            openLangModal={() => setLangModalOpen(true)}
            favoritesCount={favorites.length}
            onlyFavorites={onlyFavorites}
            setOnlyFavorites={setOnlyFavorites}
            currentUser={currentUser}
            openAuthModal={openAuthModal}
            userDropdownOpen={userDropdownOpen}
            setUserDropdownOpen={setUserDropdownOpen}
            logoutUser={logoutUser}
            searchInputRef={searchInputRef}
          />

          {/* Hero Section */}
          <HeroSection
            totalResources={rawResources.length}
            currentLangCount={langCounts[currentLang] || 0}
            currentLang={currentLang}
            openLangModal={() => setLangModalOpen(true)}
          />

          {/* Main Two-Column Workspace */}
          <div className="workspace">
            {/* Left Sidebar */}
            <Sidebar
              currentLang={currentLang}
              selectedFormat={selectedFormat}
              setSelectedFormat={setSelectedFormat}
              categories={categories}
              selectedCategory={selectedCategory}
              setSelectedCategory={setSelectedCategory}
              catFilterQuery={catFilterQuery}
              setCatFilterQuery={setCatFilterQuery}
            />

            {/* Right Content Area */}
            <main className="content-area">
              <Toolbar
                totalMatching={filteredResources.length}
                currentLang={currentLang}
                selectedCategory={selectedCategory}
                setSelectedCategory={setSelectedCategory}
                selectedFormat={selectedFormat}
                setSelectedFormat={setSelectedFormat}
                searchQuery={searchQuery}
                setSearchQuery={setSearchQuery}
                onlyFavorites={onlyFavorites}
                setOnlyFavorites={setOnlyFavorites}
                sortBy={sortBy}
                setSortBy={setSortBy}
                viewMode={viewMode}
                setViewMode={setViewMode}
                resetAllFilters={resetAllFilters}
              />

              {/* Resource Cards */}
              {filteredResources.length === 0 ? (
                <div className="empty-state">
                  <div style={{ fontSize: '2.5rem', marginBottom: '0.5rem' }}>📭</div>
                  <h3 style={{ marginBottom: '0.35rem' }}>Aucune ressource ne correspond à vos filtres</h3>
                  <p style={{ color: 'var(--text-secondary)', fontSize: '0.9rem', marginBottom: '1.15rem' }}>
                    Essayez de réinitialiser vos critères ou d'explorer les 53 langues disponibles.
                  </p>
                  <div style={{ display: 'flex', gap: '0.6rem', justifyContent: 'center' }}>
                    <button type="button" className="btn-primary" onClick={resetAllFilters}>
                      Réinitialiser les filtres
                    </button>
                    <button type="button" className="btn-ghost" onClick={() => setCurrentLang('all')}>
                      🌍 Voir toutes les langues
                    </button>
                  </div>
                </div>
              ) : (
                <>
                  <div className={`cards-grid ${viewMode === 'list' ? 'list-mode' : ''}`}>
                    {displayedItems.map((item, index) => (
                      <ResourceCard
                        key={item.url + index}
                        item={item}
                        isFavorite={favorites.includes(item.url)}
                        toggleFavorite={toggleFavorite}
                        onSelectCategory={(cat) => setSelectedCategory(cat)}
                        onOpenLesson={handleOpenLesson}
                      />
                    ))}
                  </div>

                  {/* Load More Button */}
                  {hasMore && (
                    <div className="load-more-wrap">
                      <button
                        type="button"
                        className="btn-primary"
                        onClick={() => setDisplayLimit(lim => lim + 48)}
                        style={{ padding: '0.75rem 1.75rem', fontSize: '0.92rem' }}
                      >
                        Charger plus de ressources ({filteredResources.length - displayLimit} restantes)
                      </button>
                    </div>
                  )}
                </>
              )}
            </main>
          </div>

          {/* Footer */}
          <footer>
            <p>
              <strong>ByteShelf</strong> • Bibliothèque propulsée par{" "}
              <a href="https://github.com/EbookFoundation/free-programming-books" target="_blank" rel="noopener noreferrer">
                EbookFoundation/free-programming-books
              </a>{" "}
              • 10 740 livres, cours et podcasts vérifiés en 53 langues
            </p>
          </footer>

          {/* Modals */}
          <AuthModal
            isOpen={authModalOpen}
            onClose={() => {
              setAuthModalOpen(false);
              setPendingLesson(null);
              pendingLessonRef.current = null;
            }}
            initialMode={authInitialMode}
            onLoginSuccess={handleLoginSuccess}
            showToast={showToast}
            pendingLesson={pendingLesson}
          />

          <LanguageModal
            isOpen={langModalOpen}
            onClose={() => setLangModalOpen(false)}
            currentLang={currentLang}
            onSelectLang={(code) => {
              setCurrentLang(code);
              setSelectedCategory("all");
              localStorage.setItem("fpb_manual_lang", code);
              localStorage.setItem("fpb_lang", code);
              const meta = getLangMeta(code);
              const isRtl = RTL_LANGS.includes(code) || meta.rtl;
              document.documentElement.setAttribute('dir', isRtl ? 'rtl' : 'ltr');
              document.documentElement.setAttribute('lang', code);
              showToast(`🌐 ${meta.native || meta.fr} ${meta.flag}`);
            }}
            langCounts={langCounts}
          />

          {/* Floating Toast Notification */}
          <Toast toast={toast} />
        </div>
      );
    }

    // Error Boundary Component
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("React Error caught by boundary:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div style={{ padding: '3rem', textAlign: 'center', fontFamily: 'system-ui, sans-serif' }}>
              <h2 style={{ fontSize: '1.5rem', marginBottom: '0.75rem', color: '#0f172a' }}>⚠️ Une erreur inattendue est survenue</h2>
              <p style={{ color: '#e11d48', marginBottom: '1.25rem', fontFamily: 'monospace', fontSize: '0.9rem' }}>
                {String(this.state.error?.message || this.state.error)}
              </p>
              <button
                onClick={() => { localStorage.clear(); sessionStorage.clear(); window.location.reload(); }}
                style={{ padding: '0.65rem 1.4rem', cursor: 'pointer', borderRadius: '10px', border: 'none', background: '#2563eb', color: '#fff', fontWeight: 600 }}
              >
                🔄 Réinitialiser et recharger la page
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // Mount React App
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
